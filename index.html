
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTRL+Z｜如果人生可以重選</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
  
/* 修正 AR 相機畫面 */
body {
  background: transparent !important;
}

a-scene,
a-scene canvas,
video {
  display: block !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100vw !important;
  height: 100vh !important;
  object-fit: cover !important;
  z-index: 0 !important;
}

#shade {
  pointer-events: none;
  background: transparent !important;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080e1c;
  color: white;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
}

a-scene {
  position: fixed !important;
  inset: 0;
  width: 100% !important;
  height: 100% !important;
  z-index: 0;
}

#shade {
  position: fixed;
  inset: 0;
 background: transparent !important;
    to bottom,
    rgba(5,10,25,.45),
    transparent 45%,
    rgba(5,10,25,.65)
  );
  pointer-events: none;
  z-index: 1;
}

#ui {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(20px + env(safe-area-inset-top)) 18px
           calc(20px + env(safe-area-inset-bottom));
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 4px;
}

small {
  font-size: 11px;
  letter-spacing: 2px;
  color: #bcecff;
}

#status {
  padding: 10px;
  border: 1px solid #8fdfff;
  border-radius: 25px;
  background: #14213caa;
  font-size: 12px;
  white-space: nowrap;
}

#panel {
  padding: 22px;
  background: rgba(13,23,45,.86);
  border: 1px solid #8fdfff77;
  border-radius: 24px;
  backdrop-filter: blur(12px);
}

#panel h2 {
  font-size: 24px;
  margin: 12px 0;
}

#story {
  font-size: 15px;
  line-height: 1.8;
  color: #e4edff;
}

button {
  width: 100%;
  margin-top: 14px;
  padding: 16px;
  border: none;
  border-radius: 14px;
  background: linear-gradient(90deg,#a2eaff,#e2b6ff);
  color: #15203a;
  font-size: 17px;
  font-weight: bold;
}

button.secondary {
  background: #ffffff22;
  color: white;
  border: 1px solid #ffffff66;
}

#foot {
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: #c9d9f2;
}
</style>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

 
<a-entity
  id="target"
  mindar-image-target="targetIndex: 0">


<!-- 夢境傳送門：粉紫色外圈 -->
<a-torus
  position="0 0 0.08"
  radius="0.38"
  radius-tubular="0.025"
  color="#E8A8FF"
  material="shader: flat; opacity: 0.95"
  animation="property: rotation; to: 0 0 360; loop: true; dur: 8000; easing: linear">
</a-torus>

<!-- 夢境傳送門：藍色內圈 -->
<a-torus
  position="0 0 0.10"
  radius="0.29"
  radius-tubular="0.012"
  color="#A5E9FF"
  material="shader: flat; opacity: 0.85"
  animation="property: rotation; to: 0 0 -360; loop: true; dur: 5000; easing: linear">
</a-torus>

<!-- 中央夢境光球 -->
<a-sphere
  position="0 0 0.06"
  radius="0.20"
  color="#D7B7FF"
  material="shader: flat; transparent: true; opacity: 0.55"
  animation="property: scale; from: 0.9 0.9 0.9; to: 1.15 1.15 1.15; dir: alternate; loop: true; dur: 1800">
</a-sphere>

<!-- 漂浮文字 -->
<a-text
  value="PARALLEL LIFE"
  position="0 -0.43 0.15"
  align="center"
  color="#FFFFFF"
  width="1.5">
</a-text>


</a-entity>

</a-scene>

<div id="shade"></div>

<div id="ui">
  <header>
    <div>
      <h1>CTRL+Z</h1>
      <small>PARALLEL LIFE LAB</small>
    </div>
    <div id="status">掃描海報中</div>
  </header>

  <div>
    <section id="panel">
      <small id="chapter">WELCOME</small>
      <h2 id="heading">如果人生可以重選？</h2>

      <div id="story">
        請將手機相機對準 CTRL+Z 海報，
        解鎖另一條人生路線。
      </div>

      <div id="choices">
        <button onclick="startGame()">
          先體驗人生實驗
        </button>
      </div>
    </section>

    <div id="foot">
      每一個選擇都有代價，沒有完美人生。
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

const stages = [
  {
    title: "第一關｜夢想還是安穩？",
    story: "畢業後，你獲得一份穩定工作，也有機會追逐夢想。你會怎麼選？",
    options: [
      ["追逐夢想", "你選擇未知的道路，開始一段新的冒險。"],
      ["選擇安穩", "你擁有穩定生活，卻偶爾想起另一個自己。"]
    ]
  },
  {
    title: "第二關｜離開還是留下？",
    story: "遠方有一個難得的機會，但重要的人希望你留下。",
    options: [
      ["前往新的城市", "你看見更大的世界，也開始想念熟悉的人。"],
      ["留在熟悉的地方", "你守住珍惜的關係，也放下了一次冒險。"]
    ]
  },
  {
    title: "第三關｜重新開始？",
    story: "現在的人生和想像不同，你會怎麼面對？",
    options: [
      ["勇敢改變方向", "你決定重新出發，寫下新的故事。"],
      ["珍惜現在生活", "你發現現在的人生，也有值得珍惜的地方。"]
    ]
  }
];

let stage = 0;
let history = [];
let selected = [];

function render(title, story, buttons, chapter) {
  $("heading").textContent = title;
  $("story").textContent = story;
  $("chapter").textContent = chapter;
  $("choices").innerHTML = "";

  buttons.forEach(item => {
    const btn = document.createElement("button");
    btn.textContent = item.text;
    if (item.secondary) btn.className = "secondary";
    btn.onclick = item.action;
    $("choices").appendChild(btn);
  });
}

function startGame() {
  stage = 0;
  history = [];
  selected = [];
  showStage();
}

function showStage() {
  if (stage >= stages.length) {
    showEnding();
    return;
  }

  const s = stages[stage];

  render(s.title, s.story, [
    ...s.options.map((o, i) => ({
      text: o[0],
      action: () => choose(i)
    })),
    {
      text: "↶ CTRL+Z 返回上一關",
      secondary: true,
      action: undo
    }
  ], "LEVEL 0" + (stage + 1));
}

function choose(i) {
  const s = stages[stage];
  history.push({ stage, selected: [...selected] });
  selected.push(i);
  stage++;

  render("命運正在改寫…", s.options[i][1], [
    {
      text: "繼續 →",
      action: showStage
    },
    {
      text: "↶ CTRL+Z 撤銷選擇",
      secondary: true,
      action: undo
    }
  ], "TIMELINE CHANGED");
}

function undo() {
  if (!history.length) {
    showStage();
    return;
  }

  const previous = history.pop();
  stage = previous.stage;
  selected = previous.selected;
  showStage();
}

function showEnding() {
  const brave = selected.filter(v => v === 0).length;

  const title = brave >= 2
    ? "結局｜自由的探索者"
    : "結局｜溫柔的守護者";

  render(
    title,
    "沒有一條人生能避開遺憾。重要的不是重來，而是你接下來想怎麼走。",
    [
      { text: "重新體驗另一條人生", action: startGame },
      {
        text: "↶ CTRL+Z 返回選擇",
        secondary: true,
        action: undo
      }
    ],
    "YOUR PARALLEL LIFE"
  );
}

const target = $("target");

target.addEventListener("targetFound", () => {
  $("status").textContent = "海報辨識成功";
  render(
    "平行人生入口已解鎖",
    "你準備好看見另一個自己了嗎？",
    [{ text: "進入人生實驗", action: startGame }],
    "PORTAL UNLOCKED"
  );
});

target.addEventListener("targetLost", () => {
  $("status").textContent = "請重新對準海報";
});
</script>

</body>
</html>
